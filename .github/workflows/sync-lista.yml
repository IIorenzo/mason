name: Sync lista.m3u

on:
  push:
    paths:
      - 'lista.m3u'
      - '.github/workflows/sync-lista.yml'
  workflow_run:
    workflows: ["NOMBRE_DE_TU_OTRO_ACTION"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-lista
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que existe lista.m3u
        run: |
          if [ ! -f lista.m3u ]; then
            echo "ERROR: lista.m3u no existe en la raíz del repo"
            exit 1
          fi

      - name: Generar nombres (solo la primera vez)
        run: |
          python3 - <<'EOF'
          import random, string, os
          if not os.path.exists('.github/nombres.txt'):
              nombres = set()
              while len(nombres) < 200:
                  nombres.add(''.join(random.choices(string.ascii_lowercase + string.digits, k=5)))
              with open('.github/nombres.txt', 'w') as f:
                  f.write('\n'.join(sorted(nombres)) + '\n')
          EOF

      - name: Copiar lista.m3u a las 200 copias
        run: |
          mkdir -p copias
          while read -r n; do
            cp lista.m3u "copias/$n.m3u"
          done < .github/nombres.txt

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Sync copias de lista.m3u"
            git pull --rebase origin main
            git push
          fi
