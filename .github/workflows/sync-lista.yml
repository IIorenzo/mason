name: Sync lista.m3u

on:
  schedule:
    - cron: '0 */2 * * *'   # cada 2 horas (UTC)
  push:
    paths:
      - '.github/workflows/sync-lista.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-lista
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Descargar lista original de Pastebin
        run: |
          curl -fsSL --retry 3 --retry-delay 5 \
            -A "Mozilla/5.0 (X11; Linux x86_64)" \
            "https://pastebin.com/raw/hV2z2e9g" -o lista_nueva.tmp

          # Si la descarga viene vacía, abortar sin tocar lo que ya hay
          if [ ! -s lista_nueva.tmp ]; then
            echo "ERROR: la descarga está vacía"
            exit 1
          fi

          # Normalizar saltos de línea (Windows -> Unix)
          sed -i 's/\r$//' lista_nueva.tmp
          mv lista_nueva.tmp lista.m3u

      # Descomenta si filtrar.py debe procesar la lista antes de copiarla
      # - name: Filtrar lista
      #   run: python3 filtrar.py

      - name: Generar nombres (solo la primera vez)
        run: |
          python3 - <<'EOF'
          import random, string, os
          if not os.path.exists('.github/nombres.txt'):
              nombres = set()
              while len(nombres) < 200:
                  nombres.add(''.join(random.choices(string.ascii_lowercase + string.digits, k=5)))
              with open('.github/nombres.txt', 'w') as f:
                  f.write('\n'.join(sorted(nombres)) + '\n')
          EOF

      - name: Copiar lista.m3u a las 200 copias
        run: |
          mkdir -p copias
          while read -r n; do
            cp lista.m3u "copias/$n.m3u"
          done < .github/nombres.txt

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Sync copias de lista.m3u"
            git pull --rebase origin main
            git push
          fi
