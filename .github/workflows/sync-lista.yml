name: Sync lista.m3u

on:
  schedule:
    - cron: '0 */2 * * *'   # cada 2 horas (UTC)
  push:
    paths:
      - '.github/workflows/sync-lista.yml'
      - 'filtrar.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-lista
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Descargar lista original de Pastebin
        run: |
          curl -fsSL --retry 3 --retry-delay 5 \
            -A "Mozilla/5.0 (X11; Linux x86_64)" \
            "https://pastebin.com/raw/hV2z2e9g" -o /tmp/original.m3u

          if [ ! -s /tmp/original.m3u ]; then
            echo "::error::La descarga está vacía"; exit 1
          fi
          grep -q "#EXTM3U" /tmp/original.m3u || { echo "::error::No es una lista M3U"; exit 1; }
          sed -i 's/\r$//' /tmp/original.m3u

          echo "Grupos encontrados en el original:"
          grep -o 'group-title="[^"]*"' /tmp/original.m3u | sort | uniq -c | sort -rn

      - name: Filtrar categorías
        run: |
          python3 filtrar.py /tmp/original.m3u /tmp/filtrada.m3u
          N=$(grep -c '^#EXTINF' /tmp/filtrada.m3u || true)
          if [ "$N" -eq 0 ]; then
            echo "::error::El filtro dejó 0 canales, no toco lista.m3u"; exit 1
          fi
          mv /tmp/filtrada.m3u lista.m3u

      - name: Generar nombres (solo la primera vez)
        run: |
          python3 - <<'EOF'
          import random, string, os
          if not os.path.exists('.github/nombres.txt'):
              nombres = set()
              while len(nombres) < 200:
                  nombres.add(''.join(random.choices(string.ascii_lowercase + string.digits, k=5)))
              with open('.github/nombres.txt', 'w') as f:
                  f.write('\n'.join(sorted(nombres)) + '\n')
          EOF

      - name: Copiar lista.m3u a las 200 copias
        run: |
          mkdir -p copias
          while read -r n; do
            cp lista.m3u "copias/$n.m3u"
          done < .github/nombres.txt

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Sync lista filtrada $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          else
            echo "Sin cambios"
          fi
