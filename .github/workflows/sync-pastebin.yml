name: Sincronizar Pastebin

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Descargar pastebin
        run: |
          curl -fsSL -A "Mozilla/5.0" "https://pastebin.com/raw/hV2z2e9g" -o /tmp/original.m3u

      - name: Filtrar categorías
        run: python3 filtrar.py /tmp/original.m3u lista.m3u

      - name: Commit si hay cambios
        run: |
          git add lista.m3u
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Actualización automática $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "Sin cambios"
          fi
